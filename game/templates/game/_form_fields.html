{% if form.non_field_errors %}
  <div class="err">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
